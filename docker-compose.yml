services:
  nginx:
    image: nginx:1.25.0-alpine
    container_name: archive-nginx
    restart: unless-stopped
    volumes:
      - ./app:/var/www/app
      - ./_docker/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - ${APP_EXTERNAL_PORT}:80
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
      args:
        user: archive
        uid: 1002
    image: archive-app
    container_name: archive-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www/app
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: archive-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - archive_db:/var/lib/mysql

volumes:
  archive_db:
